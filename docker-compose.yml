version: '3.8'

services:
  app_bazar:
    build: 
      context: ./bazar
      dockerfile: Dockerfile
    container_name: bazar_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/bazar?createDataBaseIfNotExist-true&serverTimezone=UTC
      DB_USER_NAME: root
      DB_PASSWORD:
      

  db:
    image: mysql:8.0
    container_name: bazar_db
    ports:
      - "3311:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: bazar
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: